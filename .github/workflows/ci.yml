name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    # 逆テストは unit 系統（1 回 35〜50 秒）を変異ごとに回すため長い。手元の 8 並列で 467 秒（2026-09-29）
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run tests
        run: pnpm test

      - name: Run type check
        run: pnpm typecheck

      # 不変条件の検査と逆テスト（tools/check）。--all と --mutate は同時に走らせない
      - name: Run invariant checks
        run: pnpm check --all --no-write

      - name: Run mutation tests
        run: pnpm check --mutate -j 4

name: Daily AI News Digest

on:
  schedule:
    # UTC 04:00 = JST 13:00 (backup: cron-job.org による primary が届かなかった日だけ即時に送る)
    # GitHub の schedule は実測で 2〜12 時間遅れるため、定時の配信には使わない
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      immediate:
        description: '即時送信（手動のテスト用。false は primary として UTC 00:00 = JST 09:00 まで待機）'
        type: boolean
        default: false
      simulate_schedule:
        description: 'schedule 起動（backup）と同じ分岐を通す（動作確認用）'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.decide.outputs.kind }}
      should_send: ${{ steps.decide.outputs.should_send }}
      send_at_utc: ${{ steps.decide.outputs.send_at_utc }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 配信の種類と送信の要否を決める
        id: decide
        run: bash .github/scripts/decide-delivery.sh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IMMEDIATE: ${{ inputs.immediate }}
          INPUT_SIMULATE_SCHEDULE: ${{ inputs.simulate_schedule }}

  send-digest:
    # ジョブ名に種類を載せる。backup の重複判定は "send-digest (primary)" の成功を探す
    name: send-digest (${{ needs.check.outputs.kind }})
    needs: check
    if: needs.check.outputs.should_send == 'true'
    runs-on: ubuntu-24.04
    # 待機の上限 SEND_MAX_WAIT_MINUTES（20 分）に取得・要約・送信の時間を足した長さ
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Send daily digest
        run: pnpm start
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          NODE_ENV: production
          # check ジョブの出力。空文字は「待たずに送る」。env.ts の zod が空を undefined にする
          SEND_AT_UTC: ${{ needs.check.outputs.send_at_utc }}
          SEND_MAX_WAIT_MINUTES: '20'
          DELIVERY_KIND: ${{ needs.check.outputs.kind }}
